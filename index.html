
<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infraslim | Kalkulator stroškov</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>INFRASLIM</h1>
            <p>Finančni pregled studia</p>
        </header>

        <section class="calculator">
            <h2>Kalkulator prihodkov in stroškov</h2>

            <label for="prihodki">Mesečni prihodki (€)</label>
            <input type="number" id="prihodki" min="0" step="0.01"
                   placeholder="Vnesi prihodke">

            <label for="stroski">Mesečni stroški (€)</label>
            <input type="number" id="stroski" min="0" step="0.01"
                   placeholder="Vnesi stroške">

            <button id="izracunaj">Izračunaj rezultat</button>

            <div class="result">
                <p>Finančni rezultat</p>
                <h2 id="rezultat">0,00 €</h2>
                <p id="sporocilo"></p>
                <p>Delež finančnega rezultata v prihodkih:</p>
<h3 id="dobickonosnost">0,00 %</h3>
            </div>
        </section>

        <footer>INFRASLIM STUDIO | RPO testni projekt</footer>
    </main>
</body>
</html>
